<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>C to F</h1>

    <input type="password" id="pswd">
    <br>
    <input type="checkbox" id="togglepswd">
    <label for="togglepswd">Show password</label>

    <script src="../assets/jquery.js"></script>
    
    <script>
        
        $(document).ready( function () {
            
            $("#togglepswd").on("change" , function() {

                console.log($(this).is(":checked"))

                if ($(this).is(":checked")){
                    $("#pswd").attr("type", "text")
                } else {
                    $("#pswd").attr("type", "password")
                }

            })
            
        })
        
    </script>
</body>
</html>
