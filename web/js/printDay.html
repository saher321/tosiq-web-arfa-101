<body>

    <fieldset>
        <legend>Print Day with number</legend>
        <input type="number" id="num1" placeholder="Enter day number 1-7">

        <button onclick="printValue()">Show Day</button>
        <br>
        <div id="result"></div>
    </fieldset>

    <script>
        // simple (arithmatic operations)

        function printValue() {

            var dayNum = document.getElementById("num1").value;
            var result = document.getElementById("result");

            switch(dayNum) {
                case "1":
                    result.innerText = "It is Monday";
                    break;
                case "2":
                    result.innerText = "It is Tuesday";
                    break;
                case "3":
                    result.innerText = "It is Wednesday";
                    break;
                case "4":
                    result.innerText = "It is Thursday";
                    break;
                case "5":
                    result.innerText = "It is Friday";
                    break;
                case "6":
                    result.innerText = "It is Saturday";
                    break;
                case "7":
                    result.innerText = "It is Sunday";
                    break;

                default:
                    result.innerText = "Invalid number";
                
            }

        }
