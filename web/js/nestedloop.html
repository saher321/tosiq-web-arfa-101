<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nested loop</h1>
    <button onclick="printdata()">Click</button>
    
    <script>

        function printdata() {

            for (var a = 2; a <= 2; a++) {
                // console.log("Outer loop: Loop a", a);
                for (var b = 1; b <= 10; b++) {
                // console.log("Inner loop: Loop b", b);
                console.log(`${a} x ${b} = ${a*b}`);
                }
            }
        }

    </script>
</body>
</html>
